name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Report the SDK in use
        run: dotnet --info

      - name: Restore
        run: dotnet restore AzureConnectivityDoctor.slnx

      - name: Build
        run: dotnet build AzureConnectivityDoctor.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test AzureConnectivityDoctor.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  format:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AzureConnectivityDoctor.slnx

      - name: Verify formatting
        run: dotnet format AzureConnectivityDoctor.slnx --verify-no-changes --no-restore --verbosity diagnostic

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AzureConnectivityDoctor.slnx

      - name: Pack the .NET global tool
        run: >
          dotnet pack src/AzureConnectivityDoctor.Cli/AzureConnectivityDoctor.Cli.csproj
          --configuration Release
          --no-restore
          --output artifacts/package

      - name: Upload the NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/package/*.nupkg
          if-no-files-found: error
